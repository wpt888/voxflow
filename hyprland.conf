# Hyprland 0.54 and earlier / hyprlang. Add this block to your Hyprland config.
$voxflow = ~/.local/bin/voxflow
$voxflowKey = code:108
bindit = , $voxflowKey, exec, $voxflow press
bindirtlpn = , $voxflowKey, exec, $voxflow release
bind = SUPER SHIFT, Escape, exec, $voxflow cancel
bind = SUPER SHIFT ALT, Escape, exec, $voxflow cancel
bind = SUPER SHIFT MOD5, Escape, exec, $voxflow cancel
